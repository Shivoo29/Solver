[package]
name = "solver-privacy-sandbox"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
solver-core = { path = "../../solver-core" }
solver-plugins = { path = "../../solver-plugins" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
async-trait = "0.1"

# Privacy features
url = "2.5"
regex = "1.10"
sha2 = "0.10"
parking_lot = "0.12"

[features]
default = ["tracker-blocking", "fingerprint-protection"]
tracker-blocking = []
fingerprint-protection = []
strict-mode = []  # Maximum privacy, may break some sites
