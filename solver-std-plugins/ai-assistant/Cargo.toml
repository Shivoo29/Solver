[package]
name = "solver-ai-assistant"
version = "0.1.0"
edition = "2021"
authors = ["Solver Team"]

[dependencies]
solver-core = { path = "../../solver-core" }
solver-plugins = { path = "../../solver-plugins" }
anyhow = "1.0"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }

# Local AI (Llama)
# Uncomment when ready to use:
# llama-cpp-rs = { version = "0.3", optional = true }

# Cloud AI (Gemini)
reqwest = { version = "0.12", features = ["json"] }

[features]
default = ["cloud-ai"]
local-ai = []  # Enable this to use Llama (requires model download)
cloud-ai = []  # Enable this to use Gemini (requires API key)
