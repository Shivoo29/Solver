<!DOCTYPE html>
<html>
<head>
    <title>CSS Grid Test</title>
    <style>
        body {
            background-color: #1a1a1a;
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        h1 {
            color: white;
            text-align: center;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .grid-item {
            background-color: #3498db;
            color: white;
            padding: 40px;
            text-align: center;
            border-radius: 10px;
        }
        .grid-item:nth-child(2n) {
            background-color: #e74c3c;
        }
        .grid-item:nth-child(3n) {
            background-color: #2ecc71;
        }
        .wide {
            grid-column: span 2;
            background-color: #f39c12;
        }
    </style>
</head>
<body>
    <h1>CSS Grid Layout Test</h1>
    <div class="grid-container">
        <div class="grid-item">Box 1</div>
        <div class="grid-item">Box 2</div>
        <div class="grid-item">Box 3</div>
        <div class="grid-item wide">Wide Box (spans 2 columns)</div>
        <div class="grid-item">Box 5</div>
        <div class="grid-item">Box 6</div>
        <div class="grid-item">Box 7</div>
        <div class="grid-item">Box 8</div>
    </div>
</body>
</html>
