[workspace]
resolver = "2"
members = [
    # Core architecture
    "solver-core",
    "solver-plugins",

    # Standard plugins
    "solver-std-plugins/rendering",
    "solver-std-plugins/javascript",
    "solver-std-plugins/networking",
    "solver-std-plugins/ai-assistant",

    # Demo browser
    "solver-demo",

    # Legacy (will be refactored into plugins)
    "browser",
    "renderer",
    "shared",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Solver Team"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
anyhow = "1.0"
